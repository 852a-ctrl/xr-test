<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Colors AR</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* 白黒線画の世界の中心に立つ。よく押すボタン（調べる・赤）は右の親指、光⇄色と緑・青は左の親指。 */
:root{
  --paper:#ffffff; --ink:#000000; --muted:#8a8a8a; --dim:rgba(0,0,0,.72);
  --red:#e01818; --green:#1fa845; --blue:#2a55ff; --past:#7fa2ff;
  --font:'DotGothic16','Hiragino Kaku Gothic ProN','Meiryo',sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--font);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#light{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .12s}
#light.on{opacity:1}
#light.red{background:radial-gradient(circle at 50% 50%,rgba(230,20,20,.26) 0,rgba(230,20,20,.15) calc(var(--lr,140px)*.8),rgba(230,20,20,0) calc(var(--lr,140px)*1.2))}
#light.green{background:radial-gradient(circle at 50% 50%,rgba(20,180,70,.28) 0,rgba(20,180,70,.16) calc(var(--lr,140px)*.8),rgba(20,180,70,0) calc(var(--lr,140px)*1.2))}
#light.blue{background:rgba(40,85,255,.16)}
#reticle{position:fixed;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%);border:2px solid var(--ink);border-radius:50%;
  pointer-events:none;opacity:.5;transition:width .15s,height .15s,opacity .15s,border-color .12s}
#reticle.aim{width:30px;height:30px;opacity:1}
#reticle.lit{width:calc(var(--lr,140px)*2);height:calc(var(--lr,140px)*2);opacity:1}
#reticle.lit.red{border-color:rgba(224,24,24,.8)}
#reticle.lit.green{border-color:rgba(20,160,60,.85)}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;background:var(--red)}

/* 上の角 */
.corner{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:6px}
#tl{left:max(12px,env(safe-area-inset-left,0px));align-items:flex-start}
#tr{right:max(12px,env(safe-area-inset-right,0px));align-items:flex-end}
.small{font-family:var(--font);font-size:14px;background:var(--paper);color:var(--ink);border:2px solid var(--ink);padding:6px 12px;cursor:pointer}
#era{font-size:13px;background:var(--paper);border:2px solid var(--ink);padding:3px 8px}
#menuRow{display:flex;align-items:center;gap:8px}
#arrow{font-size:22px;animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateX(6px)}}
.blink3{animation:blink3 .55s steps(1) 3}
@keyframes blink3{50%{background:var(--ink);color:var(--paper)}}

/* 下の左右（親指） */
.pad{position:fixed;bottom:0;display:flex;flex-direction:column;gap:10px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
#padL{left:0;padding-left:max(14px,env(safe-area-inset-left,0px));align-items:flex-start}
#padR{right:0;padding-right:max(14px,env(safe-area-inset-right,0px));align-items:flex-end}
#padBack{left:50%;transform:translateX(-50%)}
.btn{font-family:var(--font);font-size:18px;background:var(--paper);color:var(--ink);border:3px solid var(--ink);
  width:96px;height:64px;cursor:pointer;touch-action:none}
.btn.appear{animation:appear 1.2s ease-out}
@keyframes appear{from{opacity:0}to{opacity:1}}
.btn:disabled{color:#b5b5b5;border-color:#b5b5b5}
.col{width:82px;height:72px}
.col.red{border-color:var(--red);color:var(--red)}
.col.green{border-color:var(--green);color:var(--green)}
.col.blue{border-color:var(--blue);color:var(--blue)}
/* 光：押している間だけ塗る／色づけ：いつも塗る */
.col.red.on,body.paint .col.red{background:var(--red);color:var(--paper)}
.col.green.on,body.paint .col.green{background:var(--green);color:var(--paper)}
.col.blue.on,body.paint .col.blue{background:var(--blue);color:var(--paper)}
#gb{display:flex;gap:5px}
#btnMode{font-size:16px}
#btnMode b{font-weight:400;padding:0 3px}
#btnMode .cur{background:var(--ink);color:var(--paper)}
button:focus-visible{outline:3px solid var(--muted);outline-offset:2px}

/* セリフ：主人公＝黒い枠に白い文字／？？？＝白い枠に黒い文字／過去の人＝青い点線の枠 */
#dialog{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;pointer-events:none;
  padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#dbox{width:100%;max-width:680px;background:var(--ink);color:var(--paper);border:3px solid var(--paper);outline:3px solid var(--ink);
  padding:16px 20px 26px;font-size:20px;line-height:1.7;min-height:3.6em;position:relative}
#dbox.gm{background:var(--paper);color:var(--ink);border-color:var(--ink);outline-color:var(--paper)}
#dbox.past{background:#0a0f24;color:#c9d6ff;border:3px dashed var(--past);outline:none}
#dname{position:absolute;top:-16px;left:14px;font-size:14px;padding:1px 10px;background:var(--paper);color:var(--ink);border:2px solid var(--ink)}
#dbox.past #dname{background:#0a0f24;color:var(--past);border:2px dashed var(--past)}
#dmore{position:absolute;right:14px;bottom:6px;font-size:13px}

/* 黒い画面（プロローグ・暗転） */
#black{position:fixed;inset:0;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;
  padding-block:24px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));
  opacity:1;transition:opacity .6s;cursor:pointer}
#black.clear{opacity:0;pointer-events:none}
#btext{font-size:22px;line-height:1.8;max-width:26em;margin:0;min-height:3.6em;position:relative;z-index:1}
#noise{position:absolute;inset:0;width:100%;height:100%}

/* タイトル */
#title{position:fixed;inset:0;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;
  padding-block:24px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
#title h1{margin:0;font-family:"Helvetica Neue",Arial,sans-serif;font-weight:400;font-size:clamp(56px,13vw,108px);letter-spacing:.16em;
  color:var(--paper);-webkit-text-stroke:2px var(--ink);padding-left:.16em}
#title .list{display:flex;flex-direction:column;gap:14px;align-items:stretch;min-width:220px}
#title .note{font-size:12px;color:var(--muted);margin:0;text-align:center;line-height:1.7;max-width:32em}

/* 全面の画面（メニュー・暗証番号・話を振り返る・書き換え） */
.sheet{position:fixed;inset:0;background:var(--dim);display:flex;align-items:center;justify-content:center;
  padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.panel{background:var(--ink);color:var(--paper);border:3px solid var(--paper);outline:3px solid var(--ink);padding:20px;
  display:flex;flex-direction:column;gap:12px;min-width:260px;max-width:100%}
.panel button{font-family:var(--font);font-size:18px;background:var(--ink);color:var(--paper);border:2px solid var(--paper);padding:10px 16px;text-align:left;cursor:pointer}
.panel button.hint{background:var(--paper);color:var(--ink)}
#code .panel{align-items:center;gap:18px}
#digits{display:flex;gap:12px}
.digit{display:flex;flex-direction:column;align-items:center;gap:6px}
.digit .v{font-size:44px;width:64px;height:72px;border:2px solid var(--paper);display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.digit button{width:64px;text-align:center;padding:6px 0;font-size:16px}
.row{display:flex;gap:12px;flex-wrap:wrap}
#log .panel{width:min(640px,100%);max-height:80vh}
#logList{overflow-y:auto;display:flex;flex-direction:column;gap:6px;font-size:16px;line-height:1.6;padding-right:6px}
#logList .gm::before{content:'？？？　';color:var(--muted)}
#logList .past{color:var(--past)}
#logList .past::before{content:'過去の人　'}
#logList .empty{color:var(--muted)}
/* 書き換え（名前の入力画面のように） */
#editor .panel{width:min(760px,100%);max-height:92vh;gap:14px;align-items:center}
#edWord{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
#edWord button{font-size:28px;min-width:44px;padding:6px 4px;text-align:center;color:#ff4a4a;border:2px solid transparent;background:var(--ink)}
#edWord button.sel{border-color:var(--paper)}
#edWord button.chg{text-decoration:underline}
#edTabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
#edTabs button{font-size:14px;padding:5px 10px;text-align:center}
#edTabs button.cur{background:var(--paper);color:var(--ink)}
#edGrid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px;width:100%;overflow-y:auto}
#edGrid button{font-size:19px;padding:6px 0;text-align:center;min-width:0}
#editor .row{justify-content:center}
#editor .row button{text-align:center;min-width:110px}

/* 操作方法：いまの画面の上に、ボタンごとの説明を重ねる */
#manual{position:fixed;inset:0;background:rgba(0,0,0,.78);color:var(--paper)}
#manual svg{position:absolute;inset:0;width:100%;height:100%}
#manual .lab{position:absolute;font-size:15px;line-height:1.5;background:var(--ink);border:2px solid var(--paper);padding:4px 10px;white-space:pre}
#manual .close{position:absolute;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));
  font-family:var(--font);font-size:16px;background:var(--ink);color:var(--paper);border:2px solid var(--paper);padding:8px 22px;cursor:pointer}
body.manual .corner,body.manual .pad{z-index:20;pointer-events:none}
body.manual #manual{z-index:15}
#toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:6px 14px;font-size:15px;
  opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
#edWord button.blankSeen{border:2px dashed var(--green);min-width:44px;color:transparent}
#edWord button.blankReal{border-bottom:2px solid var(--paper)}
#editor.white #edWord button{color:var(--paper)}
#editor.greenLit .panel{box-shadow:0 0 0 6px rgba(31,168,69,.6)}
#edTools .edGreen{color:var(--green);border-color:var(--green);min-width:90px}
#cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1}
#eraTint{position:fixed;inset:0;pointer-events:none}
#night{position:fixed;inset:0;pointer-events:none;background:rgba(10,20,70,.22);opacity:0;transition:opacity 1.2s}
#light.white{background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.55) 0,rgba(255,255,240,.3) calc(var(--lr,140px)*.8),rgba(255,255,255,0) calc(var(--lr,140px)*1.2));mix-blend-mode:normal}
#reticle.lit.white{border-color:rgba(160,160,160,.9);box-shadow:0 0 18px rgba(255,255,255,.9) inset}
#circle{position:fixed;inset:0;width:100%;height:100%;background:var(--paper);cursor:pointer}
#manual .whiteBtn{position:absolute;width:82px;height:72px;border:3px solid #fff;background:#fff;box-shadow:0 0 30px 10px rgba(255,255,255,.9);opacity:0;transition:opacity 2.4s}
#manual .whiteBtn.show{opacity:1}
#btext .title{font-size:64px;letter-spacing:.06em}
#btext .title .s{transition:opacity 3s}
@media (prefers-reduced-motion:reduce){#arrow,.blink3,.btn.appear{animation:none}#black,#light{transition:none}}
</style>

<video id="cam" playsinline muted hidden></video>
<canvas id="gl"></canvas>
<div id="eraTint"></div>
<div id="night"></div>
<div id="light"></div>
<div id="reticle"></div>
<div id="flash"></div>

<div class="corner" id="tl"><div id="menuRow"><button class="small" id="btnMenu">メニュー</button><span id="arrow" hidden>←</span></div></div>
<div class="corner" id="tr"><button class="small" id="btnFront">正面を合わせる</button><div id="era" hidden></div></div>

<div class="pad" id="padL">
  <button class="btn" id="btnMode" hidden><b class="cur">光</b>⇄<b>色</b></button>
  <div id="gb"><button class="btn col green" id="btnGreen" hidden>緑</button><button class="btn col blue" id="btnBlue" hidden>青</button></div>
</div>
<div class="pad" id="padR">
  <button class="btn" id="btnLook" hidden disabled>調べる</button>
  <button class="btn col red" id="btnRed" hidden>赤</button>
</div>
<div class="pad" id="padBack" hidden><button class="btn" id="btnBack">やめる</button></div>

<div id="dialog" hidden><div id="dbox"><span id="dname" hidden></span><span id="dtext"></span><span id="dmore">▼</span></div></div>

<div class="sheet" id="menu" hidden><div class="panel">
  <button id="mReturn">ゲームに戻る</button>
  <button id="mSave">途中セーブして中断</button>
  <button id="mManual">操作方法</button>
  <button id="mLog">話を振り返る</button>
</div></div>

<div class="sheet" id="code" hidden><div class="panel">
  <div id="digits"></div>
  <div class="row"><button id="cOk">決定</button><button id="cCancel">やめる</button></div>
</div></div>

<div class="sheet" id="editor" hidden><div class="panel">
  <div id="edWord"></div>
  <div id="edTabs"></div>
  <div id="edGrid"></div>
  <div class="row" id="edTools" hidden></div>
  <div class="row"><button id="edOk">決定</button><button id="edCancel">やめる</button></div>
</div></div>

<div class="sheet" id="log" hidden><div class="panel">
  <div id="logList"></div>
  <button id="logClose">閉じる</button>
</div></div>

<div id="manual" hidden><svg id="mSvg"></svg><div id="mLabels"></div><button class="close" id="manClose">閉じる</button></div>

<canvas id="circle" hidden></canvas>
<div id="black" class="clear"><canvas id="noise" hidden></canvas><p id="btext"></p></div>

<div id="title">
  <h1>Colors</h1>
  <div class="list"><button class="btn" id="tNew" style="width:auto" disabled>読み込み中…</button><button class="btn" id="tCont" style="width:auto" disabled>つづきから</button></div>
  <p class="note">その場に立ったまま、端末を持って周りを見回して遊びます。<br>パソコンでは、ドラッグか矢印キーで見回し、Eで調べる・進める、J・K・Lで赤・緑・青、Qで光と色の切り替え、Escでメニュー。</p>
  <p class="note" id="err"></p>
</div>
<div id="toast"></div>

<script>
window.__err = function (m) { var e = document.getElementById('err'); if (e) e.textContent += ' ' + m; };
window.addEventListener('error', function (ev) { window.__err('エラー：' + (ev.message || '不明')); });
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
(function () {
const $ = id => document.getElementById(id);
if (typeof THREE === 'undefined') { window.__err('3D表示の部品を読み込めませんでした。'); return; }
const D2R = Math.PI / 180;
const SAVE_KEY = 'colors_ar_save_v1';
const FLOOR = -1.4, CEIL = 1.2, HGT = CEIL - FLOOR;   // 目の高さを0とする
const AIM = 0.24, LIGHT = 0.3;                       // 調べられる角度、光の届く角度（ラジアン）
const COLORS = ['red', 'green', 'blue'];

/* ================= 3D の土台 ================= */
const renderer = new THREE.WebGLRenderer({ canvas: $('gl'), antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
renderer.setClearColor(0xffffff, 1);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(62, 1, 0.05, 100);
scene.add(camera);
// 手元に引き寄せたとき、プレイヤーの周り1.3mより奥（部屋）だけを暗くする幕
const dimS = new THREE.Mesh(new THREE.SphereGeometry(1.3, 24, 16), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0, side: THREE.BackSide, depthWrite: false }));
scene.add(dimS);
const lineMat = c => new THREE.LineBasicMaterial({ color: c });
const faceMat = c => new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 });
const INK = lineMat(0x000000);
const V = (x, y, z) => new THREE.Vector3(x, y, z);
function segs(pts, mat) {
  const g = new THREE.BufferGeometry().setFromPoints(pts.map(p => V(p[0], p[1], p[2])));
  return new THREE.LineSegments(g, mat || INK);
}
function loop(pts) { const o = []; for (let i = 0; i < pts.length; i++) o.push(pts[i], pts[(i + 1) % pts.length]); return o; }
const rect2 = (x0, y0, x1, y1, z) => loop([[x0, y0, z || 0], [x1, y0, z || 0], [x1, y1, z || 0], [x0, y1, z || 0]]);
function boxLines(w, h, d, mat) { const g = new THREE.BoxGeometry(w, h, d); return new THREE.LineSegments(new THREE.EdgesGeometry(g), mat || INK); }
function solidBox(w, h, d, color, edge) {
  const g = new THREE.Group(); const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), faceMat(color)); g.add(m); g.add(boxLines(w, h, d, edge)); return g;
}

// 壁：幅 w・高さ HGT の面から、穴をくりぬく。ローカル座標は x が左右、y が床からの高さ、面は +z を向く
function wall(w, holes, mat, edgeMat) {
  const g = new THREE.Group();
  const xs = [-w / 2, w / 2];
  for (const h of holes) xs.push(h.x - h.w / 2, h.x + h.w / 2);
  xs.sort((a, b) => a - b);
  const add = (x0, x1, y0, y1) => { if (x1 - x0 < 1e-4 || y1 - y0 < 1e-4) return; const m = new THREE.Mesh(new THREE.PlaneGeometry(x1 - x0, y1 - y0), mat); m.position.set((x0 + x1) / 2, (y0 + y1) / 2, 0); g.add(m); };
  for (let i = 0; i < xs.length - 1; i++) {
    const x0 = xs[i], x1 = xs[i + 1], mid = (x0 + x1) / 2;
    const cov = holes.filter(h => Math.abs(mid - h.x) < h.w / 2).sort((a, b) => a.y - b.y);
    let y = 0;
    for (const h of cov) { add(x0, x1, y, h.y - h.h / 2); y = h.y + h.h / 2; }
    add(x0, x1, y, HGT);
  }
  const e = [];
  for (const h of holes) if (!h.noEdge) e.push(...rect2(h.x - h.w / 2, h.y - h.h / 2, h.x + h.w / 2, h.y + h.h / 2));
  if (e.length) { const l = segs(e, edgeMat || INK); l.position.z = 0.003; g.add(l); }
  return g;
}
// 部屋：幅 2W（左右）× 奥行き 2D（前後）
function roomShell(W, D, opt) {
  const grp = new THREE.Group();
  const wm = faceMat(opt.wall), em = lineMat(opt.edge);
  const place = (side, holes) => {
    const len = (side === 'front' || side === 'back') ? W * 2 : D * 2;
    const g = wall(len, holes || [], wm, em);
    placeOn(g, side, W, D); grp.add(g); return g;
  };
  const floorM = new THREE.Mesh(new THREE.PlaneGeometry(W * 2, D * 2), faceMat(opt.floor)); floorM.rotation.x = -Math.PI / 2; floorM.position.y = FLOOR; grp.add(floorM);
  const ceilM = new THREE.Mesh(new THREE.PlaneGeometry(W * 2, D * 2), faceMat(opt.wall)); ceilM.rotation.x = Math.PI / 2; ceilM.position.y = CEIL; grp.add(ceilM);
  const c = [[-W, -D], [W, -D], [W, D], [-W, D]], e = [];
  for (let i = 0; i < 4; i++) {
    const [x0, z0] = c[i], [x1, z1] = c[(i + 1) % 4];
    e.push([x0, FLOOR, z0], [x1, FLOOR, z1], [x0, CEIL, z0], [x1, CEIL, z1], [x0, FLOOR, z0], [x0, CEIL, z0]);
  }
  grp.add(segs(e, em));
  const gr = [], step = opt.grid || 0.5;
  for (let x = -W + step; x < W - 1e-6; x += step) gr.push([x, FLOOR + 0.002, -D], [x, FLOOR + 0.002, D]);
  for (let z = -D + step; z < D - 1e-6; z += step) gr.push([-W, FLOOR + 0.002, z], [W, FLOOR + 0.002, z]);
  grp.add(segs(gr, lineMat(opt.gridColor)));
  return { grp, place, W, D };
}
// 壁に物を貼る：side の壁の上で、ローカル x（左右）と y（床からの高さ）に置き、部屋の内側を向ける
function placeOn(obj, side, W, D, x, y, off) {
  x = x || 0; y = y || 0; off = off || 0;
  if (side === 'front') { obj.position.set(x, FLOOR + y, -D + off); obj.rotation.y = 0; }
  if (side === 'back') { obj.position.set(-x, FLOOR + y, D - off); obj.rotation.y = Math.PI; }
  if (side === 'right') { obj.position.set(W - off, FLOOR + y, x); obj.rotation.y = -Math.PI / 2; }

function makeCrate(s, opt) {

    pg.fillStyle = '#000'; pg.font = '150px DotGothic16, sans-serif'; pg.textAlign = 'center'; pg.textBaseline = 'middle'; pg.fillText(opt.paper, 128, 138);
    const paper = new THREE.Mesh(new THREE.PlaneGeometry(s * 0.7, s * 0.7), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(pc) }));

  lid.add(segs([...loop([[-h, o, 0], [h, o, 0], [h, o, s], [-h, o, s]]), [-k, o, h - k], [k, o, h + k], [k, o, h - k], [-k, o, h + k]]));

// 歩く道：点をつなぎ、stops の点では pause 秒止まる。最後に endPause 秒止まって最初に戻る
function makeRoute(pts, stops, pause, endPause, speed) {
  const seg = []; let t = 0;
  for (let i = 0; i < pts.length; i++) {
    if (i > 0) { const a = pts[i - 1], b = pts[i], d = Math.hypot(b[0] - a[0], b[1] - a[1]); seg.push({ t0: t, t1: t + d / speed, a, b }); t += d / speed; }

    if (p > 0) { seg.push({ t0: t, t1: t + p, a: pts[i], b: pts[i], stop: i }); t += p; }
  }
  return { total: t, at(time) {
    const tt = time % t;
    for (const s of seg) if (tt <= s.t1) { const k = s.t1 > s.t0 ? (tt - s.t0) / (s.t1 - s.t0) : 1; return { x: s.a[0] + (s.b[0] - s.a[0]) * k, z: s.a[1] + (s.b[1] - s.a[1]) * k, stop: s.stop, k, last: s === seg[seg.length - 1] }; }
    const l = pts[pts.length - 1]; return { x: l[0], z: l[1] };
  } };
}

    bed.add(solidBox(0.95, 0.45, 1.95, 0xffffff)); const pil = solidBox(0.6, 0.12, 0.32, 0xffffff); pil.position.set(0, 0.28, -0.72); bed.add(pil);
    bed.add(segs([[-0.475, 0.226, -0.3], [0.475, 0.226, -0.3]]));
    bed.position.set(-1.95, FLOOR + 0.225, -1.4); sh.grp.add(bed);

    const desk = new THREE.Group(); const top = solidBox(1.2, 0.05, 0.6, 0xffffff); top.position.y = 0.72; desk.add(top);
    for (const [x, z] of [[-0.55, -0.25], [0.55, -0.25], [-0.55, 0.25], [0.55, 0.25]]) desk.add(segs([[x, 0, z], [x, 0.7, z]]));

    const calPos = V(1.0, 0.25, -D);

    // 箱（右後ろの角）と、空の箱（左後ろの角）
    const box = makeCrate(0.6); const boxHome = V(1.75, FLOOR + 0.3, 1.75); box.g.position.copy(boxHome); box.g.lookAt(0, boxHome.y, 0); sh.grp.add(box.g);
    const box2 = makeCrate(0.6); const box2Home = V(-1.75, FLOOR + 0.3, 1.75); box2.g.position.copy(box2Home); box2.g.lookAt(0, box2Home.y, 0); sh.grp.add(box2.g);
    // 扉（右の壁）
    const door = makeDoor(0x000000, 0xffffff); placeOn(door.g, 'right', W, D, 0, 0, 0.004); sh.grp.add(door.g);
    if (F.ev.s2_door_open) door.dark.material.opacity = 1;
    const lb = (t, p) => { const m = redMark(t, 0.55); m.position.copy(p); sh.grp.add(m); return m; };
    const targets = {
      bed: { pos: V(-1.95, FLOOR + 0.5, -1.4), act: () => true, hidden: 's2_bed', label: lb('「3」', V(-1.8, FLOOR + 0.85, -1.4)),
        examine() { say(F.seen.s2_bed ? '「3」' : '簡素なベッドだ。'); } },
      desk: { pos: V(0.9, FLOOR + 0.74, -2.15), act: () => true, examine() { say('机だ。何も置かれていない。'); } },
      cal: { pos: calPos, act: () => !F.ev.s2_cal_off, hidden: 's2_cal', label: lb('「はずせる」', V(1.0, 0.25, -D + 0.12)),
        examine() {

        examine() { say(F.seen.s2_cal_back ? '「9」' : 'カレンダーがかかっていた壁だ。'); } },
      box: { pos: boxHome.clone(), act: () => true, hidden: 's2_box', label: lb('「2」', V(1.75, FLOOR + 0.9, 1.75)),

  // ---- 通路2：端末で緑。緑の光を当てている間だけ端末が透けて、奥に「21」。扉の暗証21 ----
  c2: () => {
    const F = G.flags, C = corridor('green'); C.build();
    const { W, D, sh } = C;
    const n21 = textPlane('21', '#111111', 0.32, { depth: true }); n21.position.set(0, -0.1, -D + 0.012); n21.material.opacity = 0; sh.grp.add(n21);
    const door = makeDoor(0x222222, 0x9c9c9c); placeOn(door.g, 'right', W, D, 0, 0, 0.004); sh.grp.add(door.g);
    if (F.ev.c2_door_open) door.dark.material.opacity = 1;
    const termPos = V(0, -0.25, -D);
    const targets = Object.assign(C.targets, {
      term: C.termTarget('green'),
      door: { pos: V(W, FLOOR + 1.0, 0), act: () => true,
        examine() {
          if (F.ev.c2_door_open) { goRoom('s3'); return; }
          openCode('00', v => {
            if (v !== '21') { say('……扉は動かない。'); return; }
            F.ev.c2_door_open = true; quake(0.5); rumble(0.9); fadeDark(door.dark, 0.9);
            say(['扉が開いた。緑の光を当てるとものの見え方が変わるみたいだ。', '・・・', 'この空間は何なんだろう？', '誰かが作ったのか？'], null, true);
          });
        } }
    });
    let k = 0;
    const tick = dt => {   // 緑の光が端末に当たっている間だけ、端末が透けて「21」が見える
      const on = lit('green', termPos);
      k += ((on ? 1 : 0) - k) * Math.min(1, dt * 8);
      const op = 1 - k * 0.88;
      C.termMats.forEach(m => { m.opacity = op; m.depthWrite = op > 0.95; });
      n21.material.opacity = k;
    };
    return { grp: sh.grp, targets, tick };
  },

  // ---- ステージ1-3：何もない部屋。緑で背後の壁が透けてスイッチ → 押すと箱。裏に赤で「開く」、中を緑で「45」。暗証45 ----
  s3: () => {
    const W = 2.5, D = 2.5, F = G.flags;
    const sh = roomShell(W, D, { wall: 0xffffff, floor: 0xffffff, edge: 0x000000, gridColor: 0xd4d4d4 });
    const niche = { x: 0, y: 1.4, w: 0.6, h: 0.6, noEdge: true };
    sh.place('front'); sh.place('back', [niche]); sh.place('left'); sh.place('right');
    // 背後の壁のくぼみ：奥にスイッチ。手前を壁と同じ板がふさぎ、緑の光で透ける
    const nb = new THREE.Group();
    const back = new THREE.Mesh(new THREE.PlaneGeometry(0.6, 0.6), faceMat(0xf2f2f2)); back.position.z = -0.25; nb.add(back);
    for (const [x, ry] of [[-0.3, Math.PI / 2], [0.3, -Math.PI / 2]]) { const s = new THREE.Mesh(new THREE.PlaneGeometry(0.25, 0.6), faceMat(0xe8e8e8)); s.position.set(x, 0, -0.125); s.rotation.y = ry; nb.add(s); }
    for (const [y, rx] of [[-0.3, -Math.PI / 2], [0.3, Math.PI / 2]]) { const s = new THREE.Mesh(new THREE.PlaneGeometry(0.6, 0.25), faceMat(0xe8e8e8)); s.position.set(0, y, -0.125); s.rotation.x = rx; nb.add(s); }
    nb.add(segs([...rect2(-0.3, -0.3, 0.3, 0.3, -0.25), [-0.3, -0.3, 0], [-0.3, -0.3, -0.25], [0.3, -0.3, 0], [0.3, -0.3, -0.25], [-0.3, 0.3, 0], [-0.3, 0.3, -0.25], [0.3, 0.3, 0], [0.3, 0.3, -0.25]]));
    const sw = solidBox(0.2, 0.2, 0.08, 0xffffff); sw.position.z = -0.2; nb.add(sw);
    const plate = new THREE.Mesh(new THREE.PlaneGeometry(0.6, 0.6), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 1, side: THREE.DoubleSide }));
    plate.position.z = 0.001; plate.renderOrder = 2; nb.add(plate);
    const plateEdge = segs(rect2(-0.3, -0.3, 0.3, 0.3, 0.003), new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: 0 })); nb.add(plateEdge);
    placeOn(nb, 'back', W, D, 0, 1.4); sh.grp.add(nb);
    if (F.ev.s3_pressed) sw.position.z = -0.23;
    const swPos = wallPos('back', W, D, 0, 1.4);
    // 箱：スイッチを押すと、正面の壁の前に現れる
    const box = makeCrate(0.42, { back: '開く', inside: '45' });
    const boxHome = V(0, FLOOR + 0.21, -1.9); box.g.position.copy(boxHome); box.g.lookAt(0, boxHome.y, 0); sh.grp.add(box.g);
    box.g.visible = !!F.ev.s3_pressed; if (F.ev.s3_box_open) box.lid.rotation.x = -1.9; if (F.seen.s3_box_back) box.back.material.opacity = 1;
    const door = makeDoor(0x000000, 0xffffff); placeOn(door.g, 'right', W, D, 0, 0, 0.004); sh.grp.add(door.g);
    if (F.ev.s3_door_open) door.dark.material.opacity = 1;
    const openBox = () => { if (!F.ev.s3_box_open) { F.ev.s3_box_open = true; box.opening = 0; } };
    const targets = {
      sw: { pos: swPos, act: () => !!F.seen.s3_sw,
        examine() {
          if (F.ev.s3_pressed) { say('スイッチは押されている。'); return; }
          F.ev.s3_pressed = true; sw.position.z = -0.23; rumble(0.8); quake(0.4);
          setTimeout(() => { box.g.visible = true; box.g.scale.setScalar(0.01); box.appear = 0; }, 400);
        } },
      box: { pos: boxHome.clone(), act: () => !!F.ev.s3_pressed && box.appear == null,
        examine() {
          inspect(box, boxHome, {
            onArrive: () => { if (F.seen.s3_box_back) openBox(); },
            examineHeld: () => (F.seen.s3_box_back && !F.ev.s3_box_open) ? openBox : null,
            tick: (dt) => {
              // 裏面に赤い光：裏がこちらを向いているときに「開く」が見える（以後消えない）
              const toCam = camera.position.clone().sub(box.g.getWorldPosition(V(0, 0, 0))).normalize();
              const backN = V(0, 0, -1).applyQuaternion(box.g.quaternion), topN = V(0, 1, 0).applyQuaternion(box.g.quaternion);
              if (lightColor() === 'red' && backN.dot(toCam) > 0.5 && !F.seen.s3_box_back) { F.seen.s3_box_back = true; refreshUI(); }
              box.back.material.opacity = F.seen.s3_box_back ? 1 : 0;
              const g = (lightColor() === 'green' && F.ev.s3_box_open && box.opening == null && topN.dot(toCam) > 0.2) ? 1 : 0;
              box.inside.material.opacity += (g - box.inside.material.opacity) * Math.min(1, dt * 8);
            }
          });
        } },
      door: { pos: V(W, FLOOR + 1.0, 0), act: () => true,
        examine() {
          if (F.ev.s3_door_open) { goRoom('c3'); return; }
          openCode('00', v => {
            if (v !== '45') { say('……扉は動かない。'); return; }
            F.ev.s3_door_open = true; quake(0.5); rumble(0.9); fadeDark(door.dark, 0.9); say('扉が開いた。');
          });
        } }
    };
    let k = 0;
    const tick = dt => {
      // 緑の光が背後の壁のくぼみに当たっている間だけ、壁が透けてスイッチが見える
      const on = lit('green', swPos);
      if (on) F.seen.s3_sw = true;
      k += ((on ? 1 : 0) - k) * Math.min(1, dt * 8);
      plate.material.opacity = 1 - k * 0.9; plateEdge.material.opacity = k * 0.6; plate.visible = plate.material.opacity > 0.02;
      if (box.appear != null) { box.appear = Math.min(1, box.appear + dt / 0.6); box.g.scale.setScalar(Math.max(0.01, ease(box.appear))); if (box.appear >= 1) box.appear = null; }
      crateTick(box, dt);
    };
    return { grp: sh.grp, targets, tick };
  },

  // ---- 通路3：端末で青。青い光で過去の人が正面の壁の右で何かをする。そのあと緑の光で壁が透けて通り道 → シャッターの先へ ----
  c3: () => {
    const F = G.flags, C = corridor('blue');
    const pass = { x: 1.9, y: 1.0, w: 0.8, h: 2.0, noEdge: true };
    C.build({ front: [pass] });
    const { W, D, sh } = C;
    // 通り道：奥は黒。手前を壁と同じ板がふさぎ、緑の光で透ける
    const dark = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 2.0), new THREE.MeshBasicMaterial({ color: 0x000000 })); dark.position.set(1.9, FLOOR + 1.0, -D - 0.25); sh.grp.add(dark);
    const plate = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 2.0), new THREE.MeshBasicMaterial({ color: 0xc4c4c4, transparent: true, opacity: 1, side: THREE.DoubleSide }));
    plate.position.set(1.9, FLOOR + 1.0, -D + 0.001); sh.grp.add(plate);
    const plateEdge = segs(rect2(1.5, FLOOR, 2.3, FLOOR + 2.0, -D + 0.004), new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: 0 })); sh.grp.add(plateEdge);
    // シャッター（右の壁）
    const sht = shutter(); placeOn(sht, 'right', W, D, 0, 0, 0.004); sh.grp.add(sht);
    // 過去の人：左の入口から歩いてきて、正面の壁の右で何かをしている
    const gh = makeGhost(); sh.grp.add(gh.g);
    const route = makeRoute([[-2.4, 0.4], [-0.5, -0.3], [1.9, -1.05]], [], 0, 3.0, 0.9);
    const passPos = V(1.9, FLOOR + 1.2, -D);
    const targets = Object.assign(C.targets, {
      term: C.termTarget('blue'),
      shutter: { pos: V(W, FLOOR + 1.0, 0), act: () => true, examine() { say('シャッターが下りている。'); } },
      pass: { pos: passPos, act: () => !!F.seen.c3_pass, examine() { goRoom('c3b'); } }
    });
    let k = 0, clock = 0;
    const tick = dt => {
      const blueOn = lightColor() === 'blue' && !insp;
      if (blueOn) clock += dt;
      const p = route.at(clock);
      gh.g.position.set(p.x, FLOOR, p.z); gh.g.lookAt(0, FLOOR, 0);
      gh.arm.rotation.z = p.last ? Math.sin(clock * 6) * 0.5 + 0.6 : Math.sin(clock * 4) * 0.25;
      gh.mat.opacity += ((blueOn ? 0.95 : 0) - gh.mat.opacity) * Math.min(1, dt * 8); gh.g.visible = gh.mat.opacity > 0.02;
      if (blueOn && inView(gh.g.position.clone().add(V(0, 1.0, 0)), 0.7)) F.seen.ghost_c3 = true;
      // 過去の人を見たあと、緑の光で通り道が見える
      const on = !!F.seen.ghost_c3 && lit('green', passPos, 0.45);
      if (on) F.seen.c3_pass = true;
      k += ((on ? 1 : 0) - k) * Math.min(1, dt * 8);
      plate.material.opacity = 1 - k * 0.92; plateEdge.material.opacity = k * 0.7; plate.visible = plate.material.opacity > 0.02;
    };
    return { grp: sh.grp, targets, tick };
  },

  // ---- 通路3の、シャッターの先：扉に赤で「開く」 ----
  c3b: () => {
    const W = 1.5, D = 1.5, F = G.flags;
    const sh = roomShell(W, D, { wall: 0xc4c4c4, floor: 0xb0b0b0, edge: 0x3a3a3a, gridColor: 0x9a9a9a, grid: 1.0 });
    sh.place('front'); sh.place('back'); sh.place('left'); sh.place('right');
    const sht = shutter(); placeOn(sht, 'left', W, D, 0, 0, 0.004); sh.grp.add(sht);
    const door = makeDoor(0x222222, 0x9c9c9c); placeOn(door.g, 'right', W, D, 0, 0, 0.004); sh.grp.add(door.g);
    if (F.ev.c3_door_open) door.dark.material.opacity = 1;
    const lab = redMark('「開く」', 0.55); lab.position.set(W - 0.12, FLOOR + 1.55, 0); sh.grp.add(lab);
    const targets = {
      shutter: { pos: V(-W, FLOOR + 1.0, 0), act: () => true, examine() { say('シャッターが下りている。'); } },
      door: { pos: V(W, FLOOR + 1.0, 0), act: () => true, hidden: 'c3_door', label: lab, canSee: () => !F.ev.c3_door_open,
        examine() {
          if (F.ev.c3_door_open) { goRoom('s4'); return; }
          if (!F.seen.c3_door) { say('扉は閉まっている。'); return; }
          say('「開く」', () => { F.ev.c3_door_open = true; quake(0.5); rumble(0.9); fadeDark(door.dark, 0.9); say('扉が開いた。青い光を出すと過去が見えるのか？', null, true); });
        } }
    };
    return { grp: sh.grp, targets };
  },

  // ---- ステージ1-4：鍵付きの宝箱。過去の人が止まった3か所のボタンを同じ順に → 鍵 → 宝箱 → 白紙の紙「～」→ 扉に青・緑・赤の順で「開く」 ----
  s4: () => {
    const W = 2.5, D = 2.5, F = G.flags;
    const sh = roomShell(W, D, { wall: 0xffffff, floor: 0xffffff, edge: 0x000000, gridColor: 0xd4d4d4 });
    sh.place('front'); sh.place('back'); sh.place('left'); sh.place('right');
    // 宝箱（右前の角）
    const chest = new THREE.Group();
    chest.add(solidBox(0.7, 0.36, 0.45, 0xffffff));
    chest.add(segs([[-0.35, 0.05, 0.226], [0.35, 0.05, 0.226], [-0.2, -0.18, 0.226], [-0.2, 0.18, 0.226], [0.2, -0.18, 0.226], [0.2, 0.18, 0.226]]));
    const lockp = solidBox(0.1, 0.12, 0.02, 0xffffff); lockp.position.set(0, 0.1, 0.235); chest.add(lockp);
    const clid = new THREE.Group(); clid.position.set(0, 0.18, -0.225); chest.add(clid);
    const cl = solidBox(0.7, 0.1, 0.45, 0xffffff); cl.position.set(0, 0.05, 0.225); clid.add(cl);
    const chestHome = V(1.55, FLOOR + 0.18, -1.95); chest.position.copy(chestHome); chest.lookAt(0, chestHome.y, 0); sh.grp.add(chest);
    if (F.ev.s4_chest_open) clid.rotation.x = -1.6;
    // 白紙の紙（宝箱の上に出てくる）
    const paper = new THREE.Group(); const pm = new THREE.Mesh(new THREE.PlaneGeometry(0.3, 0.4), faceMat(0xffffff)); paper.add(pm); paper.add(segs(rect2(-0.15, -0.2, 0.15, 0.2, 0.002)));
    const paperPos = V(1.55, FLOOR + 0.62, -1.95); paper.position.copy(paperPos); paper.lookAt(0, 0, 0); sh.grp.add(paper);
    paper.visible = !!F.ev.s4_chest_open;
    const paperLab = redMark('「扉の前で「過去」を「見て」「文字」を探せ」', 0.5); paperLab.position.copy(paperPos).add(V(0, 0.32, 0)); sh.grp.add(paperLab);
    // 鍵（正面の壁ぞいの床）
    const key = new THREE.Group(); const ring = []; for (let i = 0; i < 16; i++) { const a = i / 16 * Math.PI * 2, b = (i + 1) / 16 * Math.PI * 2; ring.push([Math.cos(a) * 0.05 - 0.1, 0, Math.sin(a) * 0.05], [Math.cos(b) * 0.05 - 0.1, 0, Math.sin(b) * 0.05]); }
    key.add(segs([...ring, [-0.05, 0, 0], [0.12, 0, 0], [0.08, 0, 0], [0.08, 0, 0.04], [0.12, 0, 0], [0.12, 0, 0.05]]));
    const keyPos = V(-0.2, FLOOR + 0.01, -2.0); key.position.copy(keyPos); key.scale.setScalar(1.6); sh.grp.add(key);
    key.visible = !!F.ev.s4_key && !F.ev.hasKey;
    // 床のボタン（過去の人が止まった所）。緑の光を当てている間だけ見える
    const STOPS = [[-1.7, -1.9], [1.95, 1.0], [-1.2, 1.95]];
    const btns = STOPS.map(([x, z], i) => {
      const b = new THREE.Group();
      const r1 = [], r2 = []; for (let j = 0; j < 24; j++) { const a = j / 24 * Math.PI * 2, c = (j + 1) / 24 * Math.PI * 2;
        r1.push([Math.cos(a) * 0.22, 0, Math.sin(a) * 0.22], [Math.cos(c) * 0.22, 0, Math.sin(c) * 0.22]); r2.push([Math.cos(a) * 0.14, 0, Math.sin(a) * 0.14], [Math.cos(c) * 0.14, 0, Math.sin(c) * 0.14]); }
      const m = new THREE.LineBasicMaterial({ color: 0x0f7a32, transparent: true, opacity: 0 });
      b.add(segs([...r1, ...r2], m)); b.position.set(x, FLOOR + 0.006, z); sh.grp.add(b);
      return { b, m, pos: V(x, FLOOR + 0.05, z), i, pulse: 0 };
    });
    // 扉
    const door = makeDoor(0x000000, 0xffffff); placeOn(door.g, 'right', W, D, 0, 0, 0.004); sh.grp.add(door.g);
    if (F.ev.s4_door_open) door.dark.material.opacity = 1;
    const doorLab = redMark('「開く」', 0.55); doorLab.position.set(W - 0.12, FLOOR + 1.55, 0); sh.grp.add(doorLab);
    const doorPos = V(W, FLOOR + 1.0, 0);
    // 過去の人：左の入口から、3か所で止まりながら歩く
    const gh = makeGhost(); sh.grp.add(gh.g);
    const route = makeRoute([[-2.3, 0.2], STOPS[0], STOPS[1], STOPS[2], [-2.3, 0.6]], [1, 2, 3], 1.4, 1.0, 1.3);
    let chestOpen = null, paperRise = null, keyPop = null, clock = 0, seq = 0, prevC = null;
    const targets = {
      chest: { pos: chestHome.clone().add(V(0, 0.1, 0)), act: () => !F.ev.s4_chest_open,
        examine() {
          if (!F.ev.hasKey) { say('鍵がかかっている。'); return; }
          F.ev.s4_chest_open = true; chestOpen = 0; rumble(0.6);
          setTimeout(() => { paper.visible = true; paperRise = 0; }, 500);
        } },
      paper: { pos: paperPos, act: () => !!F.ev.s4_chest_open && paperRise == null, hidden: 's4_paper', label: paperLab,
        examine() {
          if (!F.seen.s4_paper) { say('白紙の紙だ。'); return; }
          say('「扉の前で「過去」を「見て」「文字」を探せ」', () => { F.ev.s4_hint = true; });
        } },
      key: { pos: keyPos.clone().add(V(0, 0.05, 0)), act: () => !!F.ev.s4_key && !F.ev.hasKey,
        examine() { F.ev.hasKey = true; key.visible = false; say('鍵を拾った'); } },
      door: { pos: doorPos, act: () => true, hidden: 's4_door', label: doorLab, noLight: true, canSee: () => !F.ev.s4_door_open,
        examine() {
          if (F.ev.s4_door_open) { goRoom('c4'); return; }
          if (!F.seen.s4_door) { say('扉は閉まっている。'); return; }
          say('「開く」', () => { F.ev.s4_door_open = true; quake(0.5); rumble(0.9); fadeDark(door.dark, 0.9); say('扉が開いた。'); });
        } }
    };
    btns.forEach(bt => {
      targets['btn' + bt.i] = { pos: bt.pos, act: () => !!F.seen['s4_btn' + bt.i] && !F.ev.s4_key,
        examine() {
          bt.pulse = 1; click();
          const p = F.ev.bprog || 0;
          if (bt.i === p) F.ev.bprog = p + 1; else F.ev.bprog = (bt.i === 0) ? 1 : 0;
          if (F.ev.bprog >= 3) { F.ev.s4_key = true; F.ev.bprog = 0; key.visible = true; keyPop = 0; rumble(0.5); }
        } };
    });
    const tick = dt => {
      // 過去の人
      const blueOn = lightColor() === 'blue' && !insp;
      if (blueOn) clock += dt;
      const p = route.at(clock);
      gh.g.position.set(p.x, FLOOR, p.z); gh.g.lookAt(0, FLOOR, 0);
      gh.arm.rotation.z = Math.sin(clock * 4) * 0.25;
      gh.mat.opacity += ((blueOn ? 0.95 : 0) - gh.mat.opacity) * Math.min(1, dt * 8); gh.g.visible = gh.mat.opacity > 0.02;
      if (blueOn && inView(gh.g.position.clone().add(V(0, 1.0, 0)), 0.7)) F.seen.ghost_s4 = true;
      // ボタン：緑の光を当てている間だけ見える。一度見たら押せる
      for (const bt of btns) {
        const on = lit('green', bt.pos, 0.34);
        if (on) F.seen['s4_btn' + bt.i] = true;
        bt.m.opacity += ((on ? 1 : 0) - bt.m.opacity) * Math.min(1, dt * 8);
        if (bt.pulse > 0) { bt.pulse = Math.max(0, bt.pulse - dt * 1.6); bt.b.scale.setScalar(1 + (1 - bt.pulse) * 0.6); bt.m.opacity = Math.max(bt.m.opacity, bt.pulse); }
        else bt.b.scale.setScalar(1);
      }
      if (chestOpen != null) { chestOpen = Math.min(1, chestOpen + dt / 0.7); clid.rotation.x = -1.6 * ease(chestOpen); if (chestOpen >= 1) chestOpen = null; }
      if (paperRise != null) { paperRise = Math.min(1, paperRise + dt / 0.8); paper.position.copy(paperPos).add(V(0, -0.35 * (1 - ease(paperRise)), 0)); if (paperRise >= 1) paperRise = null; }
      if (keyPop != null) { keyPop = Math.min(1, keyPop + dt / 0.5); key.scale.setScalar(1.6 * ease(keyPop) + 0.01); if (keyPop >= 1) keyPop = null; }
      // 紙を読んだあと、扉に青・緑・赤の順で光を当てると「開く」が見える
      let c = null;
      const lc = lightColor();
      if (lc === 'blue' && inView(doorPos, 0.6)) c = 'blue';
      else if ((lc === 'green' || lc === 'red') && lit(lc, doorPos)) c = lc;
      if (F.ev.s4_hint && !F.seen.s4_door && c && c !== prevC) {
        const SEQ = ['blue', 'green', 'red'];
        if (c === SEQ[seq]) seq++; else seq = (c === SEQ[0]) ? 1 : 0;
        if (seq >= 3) { F.seen.s4_door = true; seq = 0; }
      }
      prevC = c;
    };
    return { grp: sh.grp, targets, tick };
  },

  // ---- 通路4：端末に触れると来た道が閉じ、？？？の話。15秒後に「私を見ろ」。青い光で過去の人 → カバーの奥のスイッチ → 赤い色。ロックを書き換えて隔壁 ----
  c4: () => {
    const F = G.flags, C = corridor(null); C.build();
    const { W, D, sh } = C;
    if (F.ev.c4_lit) C.termMats[2].color.set(0xffffff);
    // 隔壁（右の壁）と、その横のロックのスイッチ
    const bulk = makeBulk(1.2, 2.2); placeOn(bulk.g, 'right', W, D, 0.15, 0, 0.004); sh.grp.add(bulk.g);
    if (F.ev.lockOff) bulk.plate.position.y = 2.1;
    const lock = new THREE.Group(); lock.add(solidBox(0.22, 0.3, 0.06, 0xffffff)); lock.add(segs([[0, -0.08, 0.035], [0.06, 0.08, 0.035]]));
    placeOn(lock, 'right', W, D, -0.95, 1.35, 0.03); sh.grp.add(lock);
    const lockPos = wallPos('right', W, D, -0.95, 1.35);
    const lockLab = redMark('「ロックはオンになっている」', 0.5); lockLab.position.copy(lockPos).add(V(-0.12, 0.3, 0)); sh.grp.add(lockLab);
    // 入口が閉じる隔壁（左の壁）
    const back = makeBulk(1.1, 2.1); placeOn(back.g, 'left', W, D, 0, 0, 0.012); sh.grp.add(back.g);
    back.g.visible = !!F.ev.c4_closed;
    // 過去の人：端末の前で何かをしている
    const gh = makeGhost(); gh.g.position.set(-0.35, FLOOR, -D + 0.45); sh.grp.add(gh.g);
    const termPos = V(0, -0.25, -D);
    let bulkOpen = null, backDrop = null, callT = null;
    const lockEdit = { text: 'ロックはオンになっている', goal: 'ロックはオフになっている', flag: 'lockOff',
      done() { F.ev.lockOff = true; quake(0.8); rumble(1.0, true); bulkOpen = 0; say(['ロックはオフになっている', '隔壁が開いた。']); } };
    const targets = Object.assign(C.targets, {
      term: { pos: termPos, act: () => true,
        examine() {
          if (!F.ev.c4_closed) {
            F.ev.c4_closed = true; quake(0.8); rumble(1.2); back.g.visible = true; back.plate.position.y = 2.1; backDrop = 0;
            say(C4_TALK, () => { F.ev.c4_gone = true; callT = 0; }, true);
            return;
          }
          if (!F.seen.ghost_c4) { say('端末は静かに光っている。'); return; }
          if (!F.ev.c4_cover) {
            say(['誰かがカバーを外していた。外してみよう。', '奥にスイッチがある。怪しいが押してみるか。'], () => {
              F.ev.c4_cover = true; F.ev.c4_lit = true; quake(1.2); rumble(1.4, true); C.termMats[2].color.set(0xffffff);
              say('バチッ！！', () => say(C4_LETTER, () => {
                F.redPaint = true; showButton('btnMode'); startHint(false);
              }, true), true);
            }, true);
            return;
          }
          say('端末は静かに光っている。');
        } },
      back: { pos: V(-W, FLOOR + 1.0, 0), act: () => !!F.ev.c4_closed, examine() { say('来た道は閉ざされている。'); } },
      lock: { pos: lockPos, act: () => true, hidden: 'c4_lock', label: lockLab, canSee: () => !!F.redPaint, edit: lockEdit,
        examine() {
          if (F.seen.c4_lock) say(F.ev.lockOff ? '「ロックはオフになっている」' : '「ロックはオンになっている」');
          else say('スイッチがある。');
        } },
      bulk: { pos: wallPos('right', W, D, 0.15, 1.0), act: () => true,
        examine() { if (F.ev.lockOff) goRoom('s5'); else say('隔壁が閉ざされている。'); } }
    });
    const tick = dt => {
      // ？？？の話が終わって15秒（動ける）たつと「私を見ろ」
      if (F.ev.c4_gone && callT == null && !F.ev.c4_called) callT = 0;   // セーブから再開したとき
      if (F.ev.c4_gone && !F.ev.c4_called && callT != null && !dlg && !menuOpen && !codeOpen && !editOpen) {
        callT += dt; if (callT >= 15) { F.ev.c4_called = true; say('＠「私を見ろ」', null, true); }
      }
      const blueOn = lightColor() === 'blue' && !insp && F.ev.c4_called;
      gh.arm.rotation.z = Math.sin(performance.now() / 160) * 0.5 + 0.7;
      gh.g.lookAt(0, FLOOR, 0);
      gh.mat.opacity += ((blueOn ? 0.95 : 0) - gh.mat.opacity) * Math.min(1, dt * 8); gh.g.visible = gh.mat.opacity > 0.02;
      if (blueOn && inView(gh.g.position.clone().add(V(0, 1.0, 0)), 0.7)) F.seen.ghost_c4 = true;
      if (bulkOpen != null) { bulkOpen = Math.min(1, bulkOpen + dt / 1.2); bulk.plate.position.y = 2.1 * ease(bulkOpen); if (bulkOpen >= 1) bulkOpen = null; }
      if (backDrop != null) { backDrop = Math.min(1, backDrop + dt / 0.8); back.plate.position.y = 2.1 * (1 - ease(backDrop)); if (backDrop >= 1) backDrop = null; }
    };
    return { grp: sh.grp, targets, tick };
  },

  // ---- ステージ2-1：時代で変わる部屋。仕切りの壁（過去はアーチ、未来は崩れた穴）、植物（芽・若木・大木）、鍵穴は過去だけ ----
  s5: () => {
    const W = 2.5, D = 2.5, F = G.flags, PX = 1.0;
    const sh = roomShell(W, D, { wall: 0xffffff, floor: 0xffffff, edge: 0x000000, gridColor: 0xd4d4d4 });
    sh.place('front'); sh.place('back'); sh.place('left'); sh.place('right');
    // 仕切りの壁：時代ごとに3枚作り、切り替える（ローカル x ＝ 奥行き z）
    const part = {};
    const mkPart = (holes) => { const g = wall(D * 2, holes, faceMat(0xffffff), INK); g.position.set(PX, FLOOR, 0); g.rotation.y = -Math.PI / 2; sh.grp.add(g); return g; };
    part.present = mkPart([]);
    part.past = mkPart([{ x: -1.2, y: 0.95, w: 0.9, h: 1.9, noEdge: true }]);
    part.future = mkPart([{ x: 0.5, y: 0.9, w: 1.0, h: 1.0, noEdge: true }]);
    // 仕切りの上下の線
    sh.grp.add(segs([[PX, FLOOR, -D], [PX, FLOOR, D], [PX, CEIL, -D], [PX, CEIL, D]]));
    // 過去：アーチの縁
    const arch = []; for (let i = 0; i <= 16; i++) { const a = Math.PI * i / 16; arch.push([PX - 0.003, FLOOR + 1.45 + Math.sin(a) * 0.45, -1.2 + Math.cos(a) * 0.45]); }
    const archL = []; for (let i = 0; i < 16; i++) archL.push(arch[i], arch[i + 1]);
    archL.push([PX - 0.003, FLOOR, -1.65], [PX - 0.003, FLOOR + 1.45, -1.65], [PX - 0.003, FLOOR, -0.75], [PX - 0.003, FLOOR + 1.45, -0.75]);
    part.past.userData.edge = segs(archL); sh.grp.add(part.past.userData.edge);
    // 未来：崩れた穴のぎざぎざの縁と、床のがれき
    const jag = [[0.0, 0.4], [0.15, 0.55], [0.1, 0.8], [0.25, 1.1], [0.2, 1.4], [0.5, 1.33], [0.75, 1.42], [1.0, 1.25], [0.9, 1.0], [1.0, 0.7], [0.85, 0.5], [1.0, 0.4]];
    const jl = []; for (let i = 0; i < jag.length - 1; i++) jl.push([PX - 0.003, FLOOR + jag[i][1], jag[i][0]], [PX - 0.003, FLOOR + jag[i + 1][1], jag[i + 1][0]]);
    jl.push([PX - 0.003, FLOOR + 0.4, 0.0], [PX - 0.003, FLOOR + 0.4, 1.0]);
    for (const [x, z, s] of [[0.75, 0.3, 0.12], [0.6, 0.75, 0.09], [0.85, 0.95, 0.1]]) jl.push(...loop([[x - s, FLOOR + 0.004, z - s], [x + s, FLOOR + 0.004, z - s * 0.6], [x + s * 0.7, FLOOR + 0.004, z + s], [x - s * 0.8, FLOOR + 0.004, z + s * 0.7]]));
    part.future.userData.edge = segs(jl); sh.grp.add(part.future.userData.edge);
    // 鍵穴（過去だけ、仕切りの壁）
    const kh = new THREE.Group(); kh.add(segs([...rect2(-0.1, -0.14, 0.1, 0.14, 0.004)]));
    const khr = []; for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2, b = (i + 1) / 12 * Math.PI * 2; khr.push([Math.cos(a) * 0.03, 0.03 + Math.sin(a) * 0.03, 0.006], [Math.cos(b) * 0.03, 0.03 + Math.sin(b) * 0.03, 0.006]); }
    kh.add(segs([...khr, [-0.015, 0.01, 0.006], [-0.03, -0.07, 0.006], [0.015, 0.01, 0.006], [0.03, -0.07, 0.006], [-0.03, -0.07, 0.006], [0.03, -0.07, 0.006]]));
    kh.position.set(PX - 0.004, FLOOR + 1.3, -0.1); kh.rotation.y = -Math.PI / 2; sh.grp.add(kh);
    const khPos = V(PX, FLOOR + 1.3, -0.1);
    // 植物：過去は芽、現在は若木、未来は大木。若木と大木は透明な箱の場所をおおう
    const PP = V(-0.3, FLOOR, -1.6);
    const plant = {};
    const tree = (trunkH, trunkR, canopyR, canopyY) => {
      const g = new THREE.Group();
      g.add(segs([[-trunkR, 0, 0], [-trunkR * 0.7, trunkH, 0], [trunkR, 0, 0], [trunkR * 0.7, trunkH, 0], [0, 0, -trunkR], [0, trunkH, -trunkR * 0.7], [0, 0, trunkR], [0, trunkH, trunkR * 0.7]]));
      const sp = new THREE.Mesh(new THREE.IcosahedronGeometry(canopyR, 1), faceMat(0xffffff)); sp.position.y = canopyY; g.add(sp);
      const se = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.IcosahedronGeometry(canopyR, 1)), INK); se.position.y = canopyY; g.add(se);
      g.position.copy(PP); sh.grp.add(g); return g;
    };
    plant.past = new THREE.Group(); plant.past.add(segs([[0, 0, 0], [0, 0.12, 0], [0, 0.1, 0], [0.06, 0.15, 0], [0, 0.1, 0], [-0.06, 0.15, 0]]));
    plant.past.position.set(-0.3, FLOOR, -2.2); sh.grp.add(plant.past);
    plant.present = tree(1.3, 0.08, 0.55, 1.6);
    plant.future = tree(1.9, 0.22, 1.25, 2.0);
    // 鉢（どの時代も同じ場所の床に、土の丸）
    const pot = []; for (let i = 0; i < 20; i++) { const a = i / 20 * Math.PI * 2, b = (i + 1) / 20 * Math.PI * 2; pot.push([PP.x + Math.cos(a) * 0.35, FLOOR + 0.004, PP.z + Math.sin(a) * 0.35], [PP.x + Math.cos(b) * 0.35, FLOOR + 0.004, PP.z + Math.sin(b) * 0.35]); }
    sh.grp.add(segs(pot, lineMat(0x9a9a9a)));
    // 透明な箱（過去だけ。緑の光で見つけ、緑の色で実体に）。赤で「はこがある」→「はこがあく」で開き、鍵
    const TB = V(-0.3, FLOOR + 0.21, -1.6);
    const tbLines = boxLines(0.42, 0.42, 0.42, new THREE.LineDashedMaterial({ color: 0x0f8a3a, dashSize: 0.04, gapSize: 0.03, transparent: true, opacity: 0 }));
    tbLines.computeLineDistances(); tbLines.position.copy(TB); sh.grp.add(tbLines);
    const crate = makeCrate(0.42); crate.g.position.copy(TB); crate.g.lookAt(0, TB.y, 0); sh.grp.add(crate.g);
    if (F.ev.tbox_open) crate.lid.rotation.x = -1.9;
    const tbLab = redMark('「はこがある」', 0.55); tbLab.position.copy(TB).add(V(0, 0.45, 0)); sh.grp.add(tbLab);
    const key = new THREE.Group(); const ring = []; for (let i = 0; i < 16; i++) { const a = i / 16 * Math.PI * 2, b = (i + 1) / 16 * Math.PI * 2; ring.push([Math.cos(a) * 0.05 - 0.1, 0, Math.sin(a) * 0.05], [Math.cos(b) * 0.05 - 0.1, 0, Math.sin(b) * 0.05]); }
    key.add(segs([...ring, [-0.05, 0, 0], [0.12, 0, 0], [0.08, 0, 0], [0.08, 0, 0.04], [0.12, 0, 0], [0.12, 0, 0.05]]));
    const KP = V(-0.1, FLOOR + 0.01, -1.15); key.position.copy(KP); key.scale.setScalar(1.6); sh.grp.add(key);
    // 仕切りの向こう：右の壁に扉（鍵を使うとできる）。未来の崩れた穴からだけ見える
    const door = makeDoor(0x000000, 0xffffff); placeOn(door.g, 'right', W, D, 1.25, 0, 0.004); sh.grp.add(door.g);
    const DP = V(W, FLOOR + 0.6, 1.25);
    const doorLab = redMark('「とびらがとじている」', 0.5); doorLab.position.set(W - 0.12, FLOOR + 0.55, 1.25); sh.grp.add(doorLab);
    // 過去の人（現在だけ）：仕切りの壁の鍵穴の場所で何かをしている
    const gh = makeGhost(); gh.g.position.set(PX - 0.45, FLOOR, -0.1); sh.grp.add(gh.g);
    const crateOpen = () => { crate.opening = 0; };
    const targets = {
      tbox: { pos: TB.clone(), act: () => era === 'past' && (!!F.seen.s5_tbox_d || !!F.ev.tbox_real), hidden: 's5_tbox', label: tbLab,
        canSee: () => !!F.ev.tbox_real && !F.ev.tbox_open,
        real: { seen: 's5_tbox_d', flag: 'tbox_real', msg: '透明な箱が、実体になった。' },
        edit: { text: 'はこがある', goal: 'はこがあく', flag: 'tbox_open', done() { F.ev.tbox_open = true; crateOpen(); say('箱が開いた。'); } },
        examine() {
          if (!F.ev.tbox_real) { say('透明な何かがある。'); return; }
          if (F.ev.tbox_open) { say('開いた箱だ。'); return; }
          say(F.seen.s5_tbox ? '「はこがある」' : '箱だ。');
        } },
      key: { pos: KP.clone().add(V(0, 0.05, 0)), act: () => era === 'past' && !!F.ev.tbox_open && !F.ev.hasKey && !F.ev.s5_door,
        examine() { F.ev.hasKey = true; say('鍵を拾った'); } },
      keyhole: { pos: khPos, act: () => era === 'past' && !!F.seen.ghost_s5,
        examine() {
          if (F.ev.s5_door) { say('鍵がささっている。'); return; }
          if (!F.ev.hasKey) { say('壁に鍵穴がある。'); return; }
          F.ev.hasKey = false; F.ev.s5_door = true; quake(0.8); rumble(1.0);
          say('鍵をさした。壁に扉があらわれた。', null, true);
        } },
      door: { pos: DP, act: () => era === 'future' && !!F.ev.s5_door, hidden: 's5_door', label: doorLab, canSee: () => !F.ev.s5_melt,
        edit: { text: 'とびらがとじている', goal: 'とびらがとけている', flag: 's5_melt', done() { F.ev.s5_melt = true; fadeDark(door.dark, 0.9); say('とびらがとけてなくなった'); } },
        examine() {
          if (F.ev.s5_melt) { goRoom('c5'); return; }
          say(F.seen.s5_door ? '「とびらがとじている」' : '扉は閉まっている。');
        } }
    };
    let gclock = 0;
    const tick = dt => {
      for (const e of ERAS) { part[e].visible = e === era; if (part[e].userData.edge) part[e].userData.edge.visible = e === era; plant[e].visible = e === era; }
      kh.visible = era === 'past';
      // 透明な箱：過去だけ。緑の光を当てている間は点線で見える。実体になったら箱
      const inPast = era === 'past';
      const glit = inPast && lit('green', TB);
      if (glit) F.seen.s5_tbox_d = true;
      tbLines.material.opacity += ((glit && !F.ev.tbox_real ? 1 : 0) - tbLines.material.opacity) * Math.min(1, dt * 8);
      tbLines.visible = tbLines.material.opacity > 0.02;
      crate.g.visible = inPast && !!F.ev.tbox_real;
      key.visible = inPast && !!F.ev.tbox_open && !F.ev.hasKey && !F.ev.s5_door;
      door.g.visible = !!F.ev.s5_door; if (F.ev.s5_melt) door.dark.material.opacity = 1;
      crateTick(crate, dt);
      // 過去の人：現在だけ、青い光の間
      const blueOn = lightColor() === 'blue' && !insp && era === 'present';
      if (blueOn) gclock += dt;

  // ---- ステージ3-1：何もない部屋。？？？の話 → 過去の人 → 黒で世界を塗る → 白い扉 ----
  s7: () => {
    const W = 2.5, D = 2.5, F = G.flags;
    const sh = roomShell(W, D, { wall: 0xffffff, floor: 0xffffff, edge: 0x000000, gridColor: 0xd4d4d4 });
    sh.place('front'); sh.place('back'); sh.place('left'); sh.place('right');
    const back = makeBulk(1.1, 2.1); placeOn(back.g, 'left', W, D, 0, 0, 0.012); sh.grp.add(back.g);
    // 黒く塗る球（プレイヤーの周り）。塗った三角形だけを描く
    const sg = new THREE.SphereGeometry(2.3, 48, 24).toNonIndexed();
    const pos = sg.attributes.position, nTri = pos.count / 3;
    const dirs = [], area = []; let total = 0;
    const a = V(0, 0, 0), b = V(0, 0, 0), c = V(0, 0, 0);
    for (let i = 0; i < nTri; i++) {
      a.fromBufferAttribute(pos, i * 3); b.fromBufferAttribute(pos, i * 3 + 1); c.fromBufferAttribute(pos, i * 3 + 2);
      dirs.push(a.clone().add(b).add(c).normalize());
      const ar = b.clone().sub(a).cross(c.clone().sub(a)).length() / 2; area.push(ar); total += ar;
    }
    const painted = new Uint8Array(nTri); let pArea = 0;
    const blackMesh = new THREE.Mesh(sg, new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.DoubleSide, depthTest: false, depthWrite: false })); blackMesh.renderOrder = 5;
    sh.grp.add(blackMesh);
    let dirty = true;
    const rebuild = () => { const idx = []; for (let i = 0; i < nTri; i++) if (painted[i]) idx.push(i * 3, i * 3 + 1, i * 3 + 2); sg.setIndex(idx); dirty = false; };
    const paintTri = i => { if (!painted[i]) { painted[i] = 1; pArea += area[i]; dirty = true; } };
    if (F.ev.s7_black_done) for (let i = 0; i < nTri; i++) paintTri(i);
    // 白い扉（真っ黒になって15秒後、右に）
    const wd = new THREE.Group(); const wp = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 1.9), new THREE.MeshBasicMaterial({ color: 0xffffff, depthTest: false })); wp.position.y = 0.95; wp.renderOrder = 6; wd.add(wp);
    const wdl = segs(rect2(-0.45, 0, 0.45, 1.9, 0.002), new THREE.LineBasicMaterial({ color: 0xbbbbbb, depthTest: false })); wdl.renderOrder = 7; wd.add(wdl);
    wd.position.set(2.1, FLOOR + 0.25, 0); wd.rotation.y = -Math.PI / 2; sh.grp.add(wd); wd.visible = !!F.ev.s7_wdoor;
    let t = 0, t2 = 0, t3 = 0, wdT = 0;
    const targets = {
      back: { pos: V(-W, FLOOR + 1.0, 0), act: () => !F.ev.blackStarted, examine() { say('入ってきた通路は、ふさがっている。'); } },
      wdoor: { pos: V(2.1, FLOOR + 1.2, 0), act: () => !!F.ev.s7_wdoor, examine() { goRoom('s8'); } }
    };
    const cosR = Math.cos(0.36), q = V(0, 0, 0);
    const tick = dt => {
      const blocked = dlg || menuOpen || codeOpen || editOpen || manualOpen || logOpen || busy || insp;
      if (!blocked) {
        if (!F.ev.s7_gm) { t += dt; if (t >= 20) { F.ev.s7_gm = true; say(S7_GM, () => { F.ev.s7_gm_done = true; t2 = 0; }, true); } }
        else if (F.ev.s7_gm_done && !F.ev.blackReady) { t2 += dt; if (t2 >= 20) { F.ev.blackReady = true; t3 = 0; say('＠「あなたがこれまで得たものすべてを思い出せ」', null, true); } }
        else if (F.ev.blackReady && !F.ev.blackStarted) { t3 += dt; if (t3 >= 20) { t3 = 0; say('＠「あなたがこれまで得たものすべてを思い出せ。世界の色を書き換えろ」', null, true); } }
      }
      // 黒で塗る：中央の丸の向いた所が黒くなる
      if (blackOn()) {
        q.copy(fwd);
        for (let i = 0; i < nTri; i++) if (!painted[i] && dirs[i].dot(q) > cosR) { paintTri(i); F.ev.blackStarted = true; }
      }
      // 85%を超えたら、残りも見ている方から染まっていく
      if (!F.ev.s7_black_done && pArea / total >= 0.85) F.ev.s7_filling = true;
      if (F.ev.s7_filling && !F.ev.s7_black_done) {
        const rest = []; for (let i = 0; i < nTri; i++) if (!painted[i]) rest.push(i);
        rest.sort((x, y) => dirs[y].dot(fwd) - dirs[x].dot(fwd));
        rest.slice(0, 30).forEach(paintTri);

      }

    };
    const onEnter = () => { if (!F.ev.s7_closed) { F.ev.s7_closed = true; quake(0.8); rumble(1.0); } };
    return { grp: sh.grp, targets, tick, onEnter, blackable: true };
  },

  });
  const t = $('edTabs'); t.textContent = '';
  KANA_PAGES.forEach((p, i) => { const b = document.createElement('button'); b.textContent = p.name; if (i === ed.page) b.classList.add('cur'); b.onclick = () => { ed.page = i; renderEditor(); }; t.appendChild(b); });
  const g = $('edGrid'); g.textContent = '';
  for (const row of KANA_PAGES[ed.page].rows) {
    const cs = [...row];
    for (let i = 0; i < 10; i++) {
      const b = document.createElement('button');
      if (i < cs.length) { b.textContent = cs[i]; b.onclick = () => pickChar(cs[i]); } else { b.disabled = true; b.style.visibility = 'hidden'; }
      g.appendChild(b);
    }
  }
  // 空欄のある言葉で、緑を持っているときだけ：光⇄色と緑
  const tools = $('edTools'); tools.textContent = '';
  tools.hidden = !(ed.blank && G.flags.green && !blankReal());
  if (!tools.hidden) {
    const m = document.createElement('button'); m.innerHTML = ed.mode === 'light' ? '<b class="cur">光</b>⇄色' : '光⇄<b class="cur">色</b>';
    m.onclick = () => { ed.mode = ed.mode === 'light' ? 'paint' : 'light'; renderEditor(); };
    const gb = document.createElement('button'); gb.textContent = '緑'; gb.className = 'edGreen';
    gb.onpointerdown = e => {
      e.preventDefault();
      if (ed.mode === 'light') { G.flags.seen['blank_' + ed.blank.key] = true; $('editor').classList.add('greenLit'); renderEditor(); }
      else if (blankSeen() && !blankReal()) { G.flags.ev['blankreal_' + ed.blank.key] = true; softFlash('green'); renderEditor(); }
    };
    gb.onpointerup = gb.onpointerleave = () => $('editor').classList.remove('greenLit');
    tools.append(m, gb);
  }
}
function pickChar(ch) {   // 1か所だけ：ほかの場所を変えていたら元に戻す
  if (ed.blank && ed.sel === ed.blank.idx && !blankReal()) return;
  ed.chars = ed.orig.slice(); ed.chars[ed.sel] = ch; renderEditor();
}
function closeEditor(submit) {
  const e = ed; editOpen = false; $('editor').hidden = true; $('editor').classList.remove('greenLit'); ed = null; refreshUI();
  if (!submit) return;
  if (e.chars.join('').replace(/　/g, '') === e.edit.goal) { softFlash('red'); e.edit.done(); }
  else say('何も起きない。');
}
$('edOk').addEventListener('click', () => closeEditor(true));
$('edCancel').addEventListener('click', () => closeEditor(false));

/* ================= 調べる：手元に引き寄せて回す ================= */
let insp = null;
function inspect(obj, home, opt) {
  const g = obj.g; const f = V(0, 0, -1).applyQuaternion(camera.quaternion);
  const q = camera.quaternion.clone().multiply(new THREE.Quaternion().setFromAxisAngle(V(1, 0, 0), 1.3));
  insp = { obj, opt: opt || {}, home: home.clone(), homeQ: g.quaternion.clone(), state: 'in', t: 0, p0: g.position.clone(), p1: f.multiplyScalar(1.1), q0: g.quaternion.clone(), q1: q, s0: 1, s1: 1 };
  setLight(null); refreshUI();
}
function endInspect() {
  if (!insp || insp.state !== 'hold') return;
  const g = insp.obj.g;
  Object.assign(insp, { state: 'out', t: 0, p0: g.position.clone(), p1: insp.home, q0: g.quaternion.clone(), q1: insp.homeQ, s0: g.scale.x, s1: 1 });
  setLight(null); refreshUI();
}
$('btnBack').addEventListener('click', endInspect);
const qr = new THREE.Quaternion(), ax1 = V(0, 0, 0), ax2 = V(0, 0, 0);
function rotateHeld(dx, dy) {
  const g = insp.obj.g;
  ax1.set(0, 1, 0).applyQuaternion(camera.quaternion); ax2.set(1, 0, 0).applyQuaternion(camera.quaternion);
  g.quaternion.premultiply(qr.setFromAxisAngle(ax1, dx * 0.012)); g.quaternion.premultiply(qr.setFromAxisAngle(ax2, dy * 0.012));
}

/* ================= 部屋の移動・暗転 ================= */
function fadeDark(mesh, dur) { const s = performance.now(); const f = () => { const k = Math.min(1, (performance.now() - s) / (dur * 1000)); mesh.material.opacity = k; if (k < 1) requestAnimationFrame(f); }; f(); }
function openDoorAnim(door, cb) { busy = true; refreshUI(); fadeDark(door.dark, 0.6); setTimeout(() => { busy = false; cb(); }, 700); }
function blackIn(cb) { $('btext').textContent = ''; $('black').classList.remove('clear'); setTimeout(cb, 650); }
function blackOut() { $('black').classList.add('clear'); }
function loadRoom(id) {
  if (room) { scene.remove(room.grp); if (room.onLeave) room.onLeave(); }
  camera.position.set(0, 0, 0);
  const r = ROOMS[id]();
  room = Object.assign({ id }, r); scene.add(room.grp); setEra('present');
  needCalib = true; if (mode !== 'gyro') { dragYaw = 0; dragPitch = 0; }
}
let endShown = false;
function goRoom(id) {
  busy = true; setLight(null); refreshUI();
  blackIn(() => {
    if (!ROOMS[id]) { busy = false; playing = false; refreshUI(); $('btext').textContent = 'つづく'; endShown = true; return; }
    loadRoom(id); busy = false; refreshUI(); setTimeout(() => { blackOut(); if (room.onEnter) setTimeout(() => room.onEnter(), 500); }, 200);
  });
}

/* ================= 揺れ（見ている向きは動かさず、部屋の線だけを震わせる） ================= */
let quakeT = 0;
function quake(t) { quakeT = Math.max(quakeT, t); }

/* ================= プロローグと導入 ================= */
const PROLOGUE = [
  '意識を失っていたようだ', '学校が終わりいつも通り、何気ない毎日を過ごしていたような気がする', '周りからは良い子に見られているが',
  'そろそろ良い子を演じるのも疲れてきた', '期待に応える中で、自分が消えていく感覚', 'そんな事を考えていると、路地裏から何か声が聞こえた気がした',
  '気になって路地裏に入ったと思う', 'その後のことは覚えていない'
];
let pro = null, introT = -1;
function proAdvance() {
  const l = PROLOGUE[pro.i];
  if (pro.c < l.length) { pro.c = l.length; return; }
  pro.i++; pro.c = 0;
  if (pro.i >= PROLOGUE.length) { pro = null; $('btext').textContent = ''; introT = 0; $('noise').hidden = false; rumble(1.8, true); }
}
$('black').addEventListener('click', () => { if (pro) proAdvance(); else if (epi) epiAdvance(); else if (endShown) location.reload(); });
function drawNoise(k) {
  const c = $('noise'); if (c.width !== innerWidth) { c.width = innerWidth; c.height = innerHeight; }
  const g = c.getContext('2d'); g.fillStyle = '#000'; g.fillRect(0, 0, c.width, c.height);
  for (let i = 0; i < 40 * k; i++) { g.fillStyle = Math.random() < 0.7 ? '#fff' : '#555'; g.fillRect(Math.random() * c.width, Math.random() * c.height, 20 + Math.random() * 300, 1 + Math.random() * 6); }
}
function beginS1() {
  loadRoom('s1'); playing = true; refreshUI(); blackOut();
  setTimeout(() => say(['この部屋は何だろう。閉じ込められた？', '窓はあるが、扉が見当たらない。', 'どうしたらいいんだろう'], () => startHint(true), true), 700);
}

/* ================= タイトル ================= */
let camTried = false;
function goFullscreen() {
  const el = document.documentElement;
  try { const r = el.requestFullscreen ? el.requestFullscreen({ navigationUI: 'hide' }) : (el.webkitRequestFullscreen ? el.webkitRequestFullscreen() : null); if (r && r.catch) r.catch(() => {}); } catch (e) {}
}
async function askPermissions() {
  try {
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function')
      await Promise.race([DeviceOrientationEvent.requestPermission(), new Promise(r => setTimeout(r, 8000))]);
  } catch (e) {}
  // 結末で使うカメラの許可だけを先に取り、すぐに止める（ゲーム中は使わない）
  if (!camTried && window.isSecureContext && navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
    camTried = true;
    navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false }).then(s => s.getTracks().forEach(t => t.stop())).catch(() => {});
  }
  setTimeout(() => { if (gotGyro) mode = 'gyro'; }, 600);
}
function hasSave() { try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; } }
function resetUIState() { paintMode = false; toggleModeLabels(); hint = null; $('arrow').hidden = true; }
function toTitle(msg) {
  playing = false; dlg = null; insp = null; resetUIState(); refreshUI();
  $('title').hidden = false; $('tCont').disabled = !hasSave();
  if (msg) toast(msg);
}
$('tNew').addEventListener('click', async () => {
  goFullscreen(); audio(); await askPermissions();
  Object.assign(G, { flags: newFlags(), log: [] }); syncUnlocked(); resetUIState();
  $('title').hidden = true; $('black').classList.remove('clear'); pro = { i: 0, c: 0 };
});
$('tCont').addEventListener('click', async () => {
  let d = null; try { d = JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) {}
  if (!d || !ROOMS[d.scr]) return;
  goFullscreen(); audio(); await askPermissions();
  G.flags = Object.assign(newFlags(), d.flags); G.flags.seen = G.flags.seen || {}; G.flags.ev = G.flags.ev || {}; G.log = d.log || [];
  syncUnlocked(); resetUIState();
  $('title').hidden = true;
  blackIn(() => { loadRoom(d.scr); playing = true; refreshUI(); setTimeout(blackOut, 200); });
});
let toastT = 0;
function toast(s) { const el = $('toast'); el.textContent = s; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 1600); }

/* ================= キーボード（パソコンでの確認用） ================= */
const keys = new Set();
const KEYC = { KeyJ: 'red', KeyK: 'green', KeyL: 'blue' };
window.addEventListener('pointerdown', e => { if (e.target.closest && e.target.closest('button')) lastPress = performance.now(); }, true);
window.addEventListener('keydown', e => {
  lastPress = performance.now();
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  if (e.repeat) return; keys.add(e.code);
  if (pro) { if (['KeyE', 'Enter', 'Space'].includes(e.code)) proAdvance(); return; }
  if (circ) { if (['KeyE', 'Enter', 'Space'].includes(e.code)) circleAdvance(); return; }
  if (epi) { if (['KeyE', 'Enter', 'Space'].includes(e.code)) epiAdvance(); return; }
  if (codeOpen) {
    const n = codeVal.length;
    if (e.code === 'ArrowUp') { codeVal[codePos] = (codeVal[codePos] + 1) % 10; renderCode(); }
    if (e.code === 'ArrowDown') { codeVal[codePos] = (codeVal[codePos] + 9) % 10; renderCode(); }
    if (e.code === 'ArrowLeft') { codePos = Math.max(0, codePos - 1); renderCode(); }
    if (e.code === 'ArrowRight') { codePos = Math.min(n - 1, codePos + 1); renderCode(); }
    if (['KeyE', 'Enter'].includes(e.code)) closeCode(true);
    if (['Escape', 'Backspace'].includes(e.code)) closeCode(false);
    return;
  }
  if (editOpen) { if (e.code === 'Escape') closeEditor(false); return; }
  if (manualOpen) { if (['Escape', 'KeyE', 'Enter'].includes(e.code)) $('manClose').click(); return; }
  if (logOpen) { if (['Escape', 'KeyE', 'Enter'].includes(e.code)) $('logClose').click(); return; }
  if (menuOpen) { if (e.code === 'Escape') closeMenu(); return; }
  if (!playing) return;
  if (dlg) { if (['KeyE', 'Enter', 'Space'].includes(e.code)) dialogAdvance(); return; }
  if (insp && ['Escape', 'Backspace'].includes(e.code)) { endInspect(); return; }
  if (e.code === 'Escape') openMenu();
  if (e.code === 'KeyQ') toggleMode();
  if (['KeyE', 'Enter'].includes(e.code) && !$('btnLook').hidden && !$('btnLook').disabled) examine();
  const c = KEYC[e.code];
  if (c && G.flags[c] && !$('padR').hidden && !(room && room.noPower)) colorDown(c);
});
window.addEventListener('keyup', e => { keys.delete(e.code); const c = KEYC[e.code]; if (c) colorUp(c); });
window.addEventListener('blur', () => { keys.clear(); setLight(null); });

/* ================= 調べる ================= */
let aimed = null;
function examine() {
  if (room && room.examineAny && room.examineAny()) { room.examineAny()(); return; }
  if (insp) { const f = insp.opt.examineHeld && insp.opt.examineHeld(); if (f) { f(); refreshUI(); } return; }
  if (aimed && room.targets[aimed]) room.targets[aimed].examine();
}
$('btnLook').addEventListener('click', examine);

/* ================= 毎フレーム ================= */
const ease = t => t * t * (3 - 2 * t);
let last = performance.now();
function resize() {
  const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  const r = Math.tan(LIGHT) / Math.tan(camera.fov * D2R / 2) * (h / 2);
  document.documentElement.style.setProperty('--lr', r.toFixed(1) + 'px');
}
addEventListener('resize', resize);
function loopFrame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (mode === 'gyro' && ori) { if (needCalib) { needCalib = false; calibrate(); } gyroQuat(camera.quaternion, true); }
  else {
    if (!insp && !codeOpen && !editOpen && !menuOpen && !manualOpen && !logOpen) {
      if (keys.has('ArrowLeft')) dragYaw += dt * 1.6;
      if (keys.has('ArrowRight')) dragYaw -= dt * 1.6;
      if (keys.has('ArrowUp')) dragPitch = Math.min(1.3, dragPitch + dt * 1.2);
      if (keys.has('ArrowDown')) dragPitch = Math.max(-1.3, dragPitch - dt * 1.2);
    }
    euler.set(dragPitch, dragYaw, 0, 'YXZ'); camera.quaternion.setFromEuler(euler);
  }
  if (introT >= 0) { introT += dt; drawNoise(Math.max(0, 1 - introT / 1.8)); if (introT > 2.0) { introT = -1; $('noise').hidden = true; beginS1(); } }
  if (pro) { pro.c = Math.min(PROLOGUE[pro.i].length, pro.c + dt * 14); $('btext').textContent = PROLOGUE[pro.i].slice(0, Math.floor(pro.c)); }
  if (dlg) { const l = dlg.lines[dlg.i].t; dlg.c = Math.min(l.length, dlg.c + dt * 18); $('dtext').textContent = l.slice(0, Math.floor(dlg.c)); $('dmore').hidden = dlg.c < l.length; }
  if (circ) drawCircle(dt);
  if (ending) endingTick(dt);
  if (epi && !epi.done) { const l = EPILOGUE[epi.i]; epi.c = Math.min(l.length, epi.c + dt * 14); $('btext').textContent = l.slice(0, Math.floor(epi.c)); }
  dimS.material.opacity += ((insp && insp.state !== 'out' ? 0.6 : 0) - dimS.material.opacity) * Math.min(1, dt * 6);
  if (flashA > 0) { flashA = Math.max(0, flashA - dt * 0.4); $('flash').style.opacity = flashA; }

  if (room) {
    fwd.set(0, 0, -1).applyQuaternion(camera.quaternion);
    if (room.tick) room.tick(dt);
    if (quakeT > 0) { quakeT -= dt; const k = Math.max(0, quakeT) * 0.025; room.grp.position.set((Math.random() - .5) * k, (Math.random() - .5) * k, (Math.random() - .5) * k); }
    else room.grp.position.set(0, 0, 0);
    // 赤い光：光の円に入った隠れた文字は見えるようになり、そのあとも消えない
    for (const k in room.targets) {
      const t = room.targets[k];
      if (!t.hidden) continue;
      const can = (!t.canSee || t.canSee()) && t.act();
      if (can && !t.noLight && lit('red', t.pos)) G.flags.seen[t.hidden] = true;
      if (t.label) { t.label.visible = can && !!G.flags.seen[t.hidden] && !insp; t.label.lookAt(camera.position); }
    }
    aimed = null; let best = AIM;
    if (playing && !dlg && !insp && !busy) for (const k in room.targets) {
      const t = room.targets[k]; if (!t.act()) continue;
      const a = fwd.angleTo(tmp.copy(t.pos).normalize()); if (a < best) { best = a; aimed = k; }
    }
    if (!insp) $('btnLook').disabled = !aimed && !(room.examineAny && room.examineAny());
    const lc = lightColor();
    $('reticle').className = (lc === 'red' || lc === 'green' || lc === 'white') ? 'lit ' + lc : (aimed ? 'aim' : '');
    if (insp) {
      const g = insp.obj.g;
      if (insp.state === 'hold' && insp.opt.tick) insp.opt.tick(dt);
      if (insp.state !== 'hold') {
        insp.t = Math.min(1, insp.t + dt / 0.6); const e = ease(insp.t);
        g.position.lerpVectors(insp.p0, insp.p1, e); g.quaternion.slerpQuaternions(insp.q0, insp.q1, e); g.scale.setScalar(insp.s0 + (insp.s1 - insp.s0) * e);
        if (insp.t >= 1) {
          if (insp.state === 'in') { insp.state = 'hold'; if (insp.opt.onArrive) insp.opt.onArrive(); refreshUI(); }
          else { insp = null; refreshUI(); }
        }
      }
    }
  }
  renderer.render(scene, camera);
  requestAnimationFrame(loopFrame);
}

Promise.race([document.fonts && document.fonts.load ? document.fonts.load('20px DotGothic16') : Promise.resolve(), new Promise(r => setTimeout(r, 3000))])
  .catch(() => {}).then(() => {
    resize(); requestAnimationFrame(loopFrame); refreshUI();
    $('tNew').disabled = false; $('tNew').textContent = 'はじめから'; $('tCont').disabled = !hasSave();
  });
// 自動テスト用
window.__colors = { G, get room() { return room && room.id; }, get aimed() { return aimed; }, get insp() { return insp && insp.state; }, get dlg() { return !!dlg; }, get era() { return era; }, get circ() { return !!circ; }, get epi() { return !!epi; }, paint(c) { paint(c); }, setPaint(v) { paintMode = v; toggleModeLabels(); refreshUI(); }, ph(c, on) { pheld[c] = on; }, idle() { lastPress = performance.now() - 20000; },
  lookAt(x, y, z) { const v = V(x, y, z).normalize(); dragYaw = Math.atan2(-v.x, -v.z); dragPitch = Math.asin(v.y); },
  hold(c, on) { if (c === null) setLight(null); else setLight(c, !!on); }, rot(dx, dy) { if (insp) rotateHeld(dx, dy); },
  go(id) { $('title').hidden = true; loadRoom(id); playing = true; syncUnlocked(); refreshUI(); } };
})();
</script>
